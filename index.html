<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Joke app practice">
    <meta name="keywords" content="joke, app, practice">
    <title>Blagues pas ouf!</title>
    <link rel="icon" type="image/svg" href="/favicon.svg">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

<header>
    <h1>Blagues pas ouf!</h1>
</header>

<main>
    <div class="theme-controls">
        <button type="button" class="theme-toggle">Passer en mode sombre</button>
    </div>
    <section class="joke-section" aria-label="Blague aléatoire">
        <div class="joke-output" aria-live="polite" aria-atomic="true">
            <button type="button" class="joke-button" aria-label="Afficher une blague aléatoire" title="Afficher une blague aléatoire">
                <span class="joke-button-icon" aria-hidden="true"></span>
            </button>
            <div class="joke-dialogue">
                <p class="joke-dialogue-premise"></p>
                <p class="joke-dialogue-reaction">🤔 💭</p>
                <button type="button" class="joke-dialogue-reveal" aria-label="Révéler la chute" title="Révéler la chute" aria-controls="joke-dialogue-punchline" aria-expanded="false">
                    <span class="joke-dialogue-reveal-icon" aria-hidden="true"></span>
                </button>
                <p class="joke-dialogue-punchline" id="joke-dialogue-punchline" aria-hidden="true"></p>
            </div>
        </div>
    </section>
</main>

<footer><p>Blagues pas ouf! distributeur de blagues.</p></footer>

<script src="/scripts/app.js" type="module"></script>

</body>
</html>
